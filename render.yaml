# Render Blueprint: https://render.com/docs/blueprint-spec
# Values marked "sync: false" are typed into the Render dashboard and never stored in this repository.
services:
  - type: web
    name: ppa-battery-store
    runtime: docker
    # Free preview. Render says not to use free instances for production, and they cannot send email on ports 25, 465 or 587.
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN # the public https address of the site, used in password reset links
        sync: false
      - key: ONLINE_SHOP
        value: "false"
      - key: OWNER_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL # only needed while running the seed once
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
