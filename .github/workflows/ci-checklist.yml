name: CI Checklist
run-name: ${{ inputs.commit_message }}

# Run from the Actions tab. Uploaded changes are committed to main only if every selected check passes.
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch holding the uploaded changes
        required: true
        default: upload-staging
      commit_message:
        description: Commit message
        required: true
      checks:
        description: "Checks to run (security always runs): dependencies server website e2e deployment docs"
        required: true
        default: dependencies server website e2e deployment docs

permissions:
  contents: read

concurrency:
  group: ci-checklist
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Reject unknown check names
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          for name in $CHECKS; do
            case "$name" in
              dependencies|server|website|e2e|deployment|docs) ;;
              *) echo "::error::Unknown check: $name"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_branch }}
      - name: Record the version being checked
        id: version
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  security:
    needs: prepare
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  dependencies:
    needs: prepare
    if: contains(inputs.checks, 'dependencies')
    uses: ./.github/workflows/dependencies.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  server:
    needs: prepare
    if: contains(inputs.checks, 'server')
    uses: ./.github/workflows/server.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  website:
    needs: prepare
    if: contains(inputs.checks, 'website')
    uses: ./.github/workflows/website.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  e2e:
    needs: prepare
    if: contains(inputs.checks, 'e2e')
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  deployment:
    needs: prepare
    if: contains(inputs.checks, 'deployment')
    uses: ./.github/workflows/deployment.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  docs:
    needs: prepare
    if: contains(inputs.checks, 'docs')
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  commit:
    name: Commit to main
    needs: [prepare, security, dependencies, server, website, e2e, deployment, docs]
    # Unselected checks are skipped. Any failed or cancelled check stops the commit.
    if: ${{ !cancelled() && !failure() && needs.prepare.result == 'success' && needs.security.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to refresh the README badges
    env:
      GIT_AUTHOR_NAME: Aarushi Kulkarni
      GIT_AUTHOR_EMAIL: 242779245+aarushikulkarni8@users.noreply.github.com
      GIT_COMMITTER_NAME: Aarushi Kulkarni
      GIT_COMMITTER_EMAIL: 242779245+aarushikulkarni8@users.noreply.github.com
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      CHECKS: ${{ inputs.checks }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Commit the checked changes
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA"

          if ! git merge-base --is-ancestor HEAD "$SOURCE_SHA"; then
            echo "::error::The upload is behind main. Rebuild it from the latest main."; exit 1
          fi
          if ! git diff --quiet HEAD "$SOURCE_SHA" -- .github/workflows; then
            echo "::error::Workflow files cannot be changed through this workflow."; exit 1
          fi

          git read-tree -u --reset "$SOURCE_SHA"
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "$COMMIT_MESSAGE"
            git push origin HEAD:main
          fi

      - name: Refresh the README badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in security $CHECKS; do
            gh workflow run "$name.yml" --ref main
          done

      - name: Checklist summary
        env:
          RESULTS: |
            Security=${{ needs.security.result }}
            Dependency audit=${{ needs.dependencies.result }}
            Server build=${{ needs.server.result }}
            Website build=${{ needs.website.result }}
            End-to-end tests=${{ needs.e2e.result }}
            Deployment=${{ needs.deployment.result }}
            Docs=${{ needs.docs.result }}
        run: |
          {
            echo "### Commit checklist"
            echo "$RESULTS" | while IFS='=' read -r label result; do
              case "$result" in
                success) echo "- [x] $label" ;;
                skipped) echo "- [ ] $label (not selected for this commit)" ;;
              esac
            done
            echo
            echo "Commit: $(git log -1 --format='%h %s (%an)')"
          } >> "$GITHUB_STEP_SUMMARY"
